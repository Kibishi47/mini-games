services:
  redis:
    image: redis:7-alpine
    container_name: minigames_redis_dev
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data_dev:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 2s
      retries: 5

  backend-dev:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    container_name: minigames_backend_dev
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
    environment:
      - APP_ENV=development
      - APP_PORT=8080
      - FRONTEND_URL=http://localhost:3000
      - REDIS_ADDR=redis:6379
      - REDIS_PASSWORD=
    volumes:
      - ./backend:/app
      - /app/tmp
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:8080/health || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 5

  frontend-dev:
    image: node:20-alpine
    container_name: minigames_frontend_dev
    restart: unless-stopped
    working_dir: /app
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.nuxt
    environment:
      - NODE_ENV=development
      - NUXT_PUBLIC_API_URL=http://localhost:8080
      - NUXT_PUBLIC_WS_URL=ws://localhost:8080/ws
    ports:
      - "3000:3000"
    command: ["sh", "-c", "npm install && npm run dev"]

volumes:
  redis_data_dev:
