services:
  postgres:
    image: postgres:16-alpine
    container_name: minigames_postgres_dev
    restart: unless-stopped
    environment:
      POSTGRES_USER: minigames
      POSTGRES_PASSWORD: minigames_secret
      POSTGRES_DB: minigames_db
    ports:
      - "5432:5432"
    volumes:
      - pg_data_dev:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U minigames -d minigames_db"]
      interval: 3s
      timeout: 3s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: minigames_redis_dev
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data_dev:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 2s
      retries: 5

  backend-dev:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    container_name: minigames_backend_dev
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      - APP_ENV=development
      - APP_PORT=8080
      - FRONTEND_URL=http://localhost:3000
      - DATABASE_URL=postgres://minigames:minigames_secret@postgres:5432/minigames_db?sslmode=disable
      - REDIS_ADDR=redis:6379
      - JWT_SECRET=super_secret_jwt_key_change_in_production_min_32_chars!
      - JWT_EXPIRATION_HOURS=72
      - DISCORD_CLIENT_ID=
      - DISCORD_CLIENT_SECRET=
      - DISCORD_REDIRECT_URI=http://localhost:8080/api/auth/discord/callback
    volumes:
      - ./backend:/app
      - /app/tmp
    ports:
      - "8080:8080"

  frontend-dev:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    container_name: minigames_frontend_dev
    restart: unless-stopped
    depends_on:
      - backend-dev
    environment:
      - NODE_ENV=development
      - PORT=3000
      - HOST=0.0.0.0
      - NUXT_PUBLIC_API_URL=http://localhost:8080
      - NUXT_PUBLIC_WS_URL=ws://localhost:8080/ws
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.nuxt
    ports:
      - "3000:3000"

volumes:
  pg_data_dev:
  redis_data_dev:
