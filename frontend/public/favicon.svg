<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- Hard offset shadow Pop Moderniste -->
  <rect x="7" y="7" width="52" height="52" rx="10" fill="#121212" />
  <!-- Main tile with vibrant yellow background & thick 3px black stroke -->
  <rect x="3" y="3" width="52" height="52" rx="10" fill="#FFD300" stroke="#121212" stroke-width="4" stroke-linejoin="round" />
  <!-- Inner pop border highlight (subtle board-game punch) -->
  <rect x="7" y="7" width="44" height="44" rx="7" fill="none" stroke="#FFFFFF" stroke-width="1.5" opacity="0.6" />
  <!-- Central bold letter W (Archivo Black style) -->
  <text x="29" y="42" font-family="'Archivo Black', 'Arial Black', Impact, sans-serif" font-weight="900" font-size="34" fill="#121212" text-anchor="middle">W</text>
</svg>
